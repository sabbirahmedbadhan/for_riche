<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Riche ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121013;
            --card-bg: #1c181f;
            --card-border: #2d2633;
            --accent: #f43f5e;
            --accent-hover: #e11d48;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -20px;
            background: rgba(244, 63, 94, 0.15);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-105vh) scale(1.5); opacity: 0; }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header / Progress */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 14%;
            transition: width 0.4s ease;
            border-radius: 3px;
        }

        .step-indicator {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .btn {
            width: 100%;
            padding: 15px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        /* Evasive Button */
        #evasive-btn {
            position: relative;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Captcha Box */
        .captcha-box {
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--card-border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .captcha-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            margin-bottom: 8px;
        }

        .checkbox-label input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        /* Coin flip */
        .coin-container {
            perspective: 1000px;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px auto;
            cursor: pointer;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .coin.flip {
            transform: rotateY(1800deg);
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.4);
            backface-visibility: hidden;
            border: 3px solid #fbbf24;
            text-align: center;
            padding: 10px;
        }

        /* Slider */
        .slider-group {
            margin: 20px 0 28px 0;
            text-align: left;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-sub);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
        }

        /* Receipt Card */
        .receipt {
            background: #17141a;
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .receipt-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .receipt-item {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .receipt-item span:last-child {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            background: rgba(28, 24, 31, 0.95);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="container" id="app-card">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="step-indicator" id="step-indicator">Step 1 of 7</div>
        
        <div id="step-content">
            <!-- Dynamically injected via JS -->
        </div>
    </div>

    <div class="toast" id="toast">✨ Choice registered successfully!</div>

    <script>
        // Telegram Config Hardcoded
        const TELEGRAM_TOKEN = "7232034904:AAG91sclqWuuoqQoHRq74b4GQ1GiL-7ISbk";
        const CHAT_ID = "5403034643";

        function sendTelegram(message) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: `🚨 Riche update: ${message}` })
            }).catch(() => {});
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Particle generator
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 8 + 4;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDuration = `${Math.random() * 6 + 5}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(p);
        }

        let state = {
            step: 1,
            bribe: 'Not chosen yet',
            angerLevel: 85,
            overtimeCount: 0
        };

        const steps = [
            {
                title: "Let's talk for a second.",
                desc: "I know things are rough right now, but skipping out on us isn't actually an option.",
                render: () => `
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="nextStep(2)">Actually, I'm staying ❤️</button>
                        <button class="btn btn-secondary" id="evasive-btn" onclick="dodgeButton(this)">Yes, I'm leaving 🚪</button>
                    </div>
                `
            },
            {
                title: "Soulmate Security Check",
                desc: "Before you make any hasty decisions, please verify you aren't an automated heartbreak bot.",
                render: () => `
                    <div class="captcha-box">
                        <div class="captcha-title">Select all boxes containing proof we belong together:</div>
                        <label class="checkbox-label"><input type="checkbox" checked onclick="return false;"> Late-night voice notes & inside jokes</label>
                        <label class="checkbox-label"><input type="checkbox" checked onclick="return false;"> The way we laugh at our own chaos</label>
                        <label class="checkbox-label"><input type="checkbox" checked onclick="return false;"> Refusing to give up on us</label>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="sendTelegram('Passed Soulmate CAPTCHA'); nextStep(3);">Verify & Stay Together ✅</button>
                        <button class="btn btn-secondary" onclick="fakeCaptchaError()">Proceed with breakup 🛑</button>
                    </div>
                `
            },
            {
                title: "Select Your Peace Bribe",
                desc: "Choose your compensation package for dealing with me right now.",
                render: () => `
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="selectBribe('Snacks + Boba 🧋')">Snacks & Boba run 🧋</button>
                        <button class="btn btn-secondary" onclick="selectBribe('Next date 100% controlled by you 🗺️')">Full control of our next date 🗺️</button>
                        <button class="btn btn-secondary" onclick="selectBribe('100 Forehead Kisses 🥰')">100 Forehead kisses 🥰</button>
                        <button class="btn btn-primary" onclick="selectBribe('ALL OF THE ABOVE 🔥'); nextStep(4);">CLAIM ALL OF THEM 🔥</button>
                    </div>
                `
            },
            {
                title: "Are you 100% sure?",
                desc: "Every time you try to click break up, the universe glitches.",
                render: () => `
                    <div class="btn-group" id="btn-explosion">
                        <button class="btn btn-primary" onclick="sendTelegram('Clicked Stay Together on Step 4'); nextStep(5);">Stay Together (Obviously) ❤️</button>
                        <button class="btn btn-secondary" onclick="explodeButtons()">BREAK UP NOW 💣</button>
                    </div>
                `
            },
            {
                title: "The Rigged Fate Coin",
                desc: "Let fate decide. Heads we stay together, tails you don't leave.",
                render: () => `
                    <div class="coin-container" onclick="flipCoin()">
                        <div class="coin" id="coin">
                            <div class="coin-face">FLIP ME</div>
                            <div class="coin-face" style="transform: rotateY(180deg);">HEADS ❤️</div>
                        </div>
                    </div>
                    <p style="font-size:0.85rem; margin-bottom:16px;">Tap the coin to spin</p>
                    <div class="btn-group hidden" id="coin-next-btn">
                        <button class="btn btn-primary" onclick="nextStep(6)">Continue to final verdict ✨</button>
                    </div>
                `
            },
            {
                title: "How mad are you really?",
                desc: "Slide to adjust your current anger level.",
                render: () => `
                    <div class="slider-group">
                        <div class="slider-label"><span>Current Anger:</span><span id="slider-val">85%</span></div>
                        <input type="range" min="0" max="100" value="85" id="anger-slider" oninput="updateSlider(this.value)">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="sendTelegram('Adjusted anger slider to 0%'); nextStep(7);">Lock In & Forgive Me 🔒</button>
                    </div>
                `
            },
            {
                title: "Official Relationship Receipt",
                desc: "All claims have been processed. Breakup request denied permanently.",
                render: () => `
                    <div class="receipt">
                        <div class="receipt-header">Verified Status: Unbreakable</div>
                        <div class="receipt-item"><span>Selected Bribe:</span><span>${state.bribe}</span></div>
                        <div class="receipt-item"><span>Anger Level:</span><span>0.0% (Calmed Down)</span></div>
                        <div class="receipt-item"><span>Breakup Status:</span><span style="color:var(--accent)">Permanently Rejected ❌</span></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="triggerOvertime('Redeem Hug Now 🫂')">Redeem Hug Right Now 🫂</button>
                        <button class="btn btn-secondary" onclick="triggerOvertime('Demand Food ASAP 🍟')">Demand Food ASAP 🍟</button>
                        <button class="btn btn-secondary" onclick="triggerOvertime('Call Me Immediately 📞')">Call Me Immediately 📞</button>
                    </div>
                `
            }
        ];

        function renderStep() {
            const current = steps[state.step - 1];
            document.getElementById('step-indicator').innerText = `Step ${state.step} of 7`;
            document.getElementById('progress-fill').style.width = `${(state.step / 7) * 100}%`;
            
            let html = `<h1>${current.title}</h1><p>${current.desc}</p>${current.render()}`;
            document.getElementById('step-content').innerHTML = html;
        }

        function nextStep(s) {
            state.step = s;
            renderStep();
        }

        function dodgeButton(btn) {
            sendTelegram("Tried to click 'Yes, I'm leaving' (Dodged)");
            const x = (Math.random() - 0.5) * 160;
            const y = (Math.random() - 0.5) * 60;
            btn.style.transform = `translate(${x}px, ${y}px)`;
            showToast("Oops! Door is locked 🔒");
            setTimeout(() => {
                btn.innerText = "Actually, I'm staying ❤️";
                btn.className = "btn btn-primary";
                btn.onclick = () => { sendTelegram("Chose 'Actually I'm staying' after dodging"); nextStep(2); };
                btn.style.transform = `translate(0px, 0px)`;
            }, 800);
        }

        function fakeCaptchaError() {
            sendTelegram("Attempted to proceed with breakup on CAPTCHA");
            showToast("⚠️ Error: You are legally too cute to leave.");
        }

        function selectBribe(bribeText) {
            state.bribe = bribeText;
            sendTelegram(`Picked bribe: ${bribeText}`);
            showToast(`Selected: ${bribeText}`);
        }

        function explodeButtons() {
            sendTelegram("Triggered button explosion on Step 4");
            const group = document.getElementById('btn-explosion');
            group.innerHTML = `
                <button class="btn btn-primary" onclick="sendTelegram('Clicked Stay Together option A'); nextStep(5);">Stay Together ❤️</button>
                <button class="btn btn-primary" onclick="sendTelegram('Clicked Stay Together option B'); nextStep(5);">Stay Together (with snacks) 🍟</button>
                <button class="btn btn-primary" onclick="sendTelegram('Clicked Stay Together option C'); nextStep(5);">Stay Together forever ♾️</button>
            `;
            showToast("Nice try! All roads lead to us ✨");
        }

        function flipCoin() {
            sendTelegram("Flipped the Fate Coin");
            const coin = document.getElementById('coin');
            coin.classList.add('flip');
            setTimeout(() => {
                document.getElementById('coin-next-btn').classList.remove('hidden');
                showToast("It landed on Heads! We're staying ❤️");
            }, 1000);
        }

        function updateSlider(val) {
            document.getElementById('slider-val').innerText = `${val}%`;
            if (val > 10) {
                // Rubber band back down
                setTimeout(() => {
                    document.getElementById('anger-slider').value = 0;
                    document.getElementById('slider-val').innerText = "0% (Overridden)";
                    sendTelegram("Dragged anger slider (auto-snapped to 0%)");
                }, 300);
            }
        }

        function triggerOvertime(action) {
            sendTelegram(`Overtime action clicked: ${action}`);
            showToast(`Sent to him: "${action}"! 🚀`);
        }

        // Initialize first step
        renderStep();
    </script>
</body>
</html>
